<script>
  const form = document.getElementById("contact-form");
  const status = document.getElementById("form-status");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    status.textContent = "Sending...";

    const formData = {
      name: document.getElementById("name").value,
      company: document.getElementById("company").value,
      email: document.getElementById("email").value,
      inquiry_type: document.getElementById("inquiry_type").value,
      message: document.getElementById("message").value
    };

    try {
      const response = await fetch(
        "https://script.google.com/macros/s/AKfycbxnS6B79p_GqEQDASfshwQG72o9wrTEl_OO_0-VYuqkC1JR8A3L-NB030c8swJrp0K8/exec",
        {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(formData)
        }
      );

      const result = await response.json();

      if (result.success) {
        status.textContent = "Thank you. Your inquiry has been sent successfully.";
        form.reset();
      } else {
        status.textContent = "Sorry, something went wrong. Please try again.";
      }

    } catch (error) {
      status.textContent = "Sorry, something went wrong. Please try again.";
    }
  });
</script>
