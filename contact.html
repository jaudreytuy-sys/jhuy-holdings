<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Contact JHUY Holdings</title>

  <meta
    name="description"
    content="Contact JHUY Holdings for transportation and premium fruit inquiries."
  >

  <link
    rel="stylesheet"
    href="assets/site.css?v=5"
  >
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">

    <a class="holdings-brand" href="index.html">

      <span class="holdings-mark">J</span>

      <span>
        <strong>JHUY</strong>
        <small>HOLDINGS</small>
      </span>

    </a>


    <button
      class="menu-btn"
      aria-label="Open menu"
      aria-expanded="false"
    >
      ☰
    </button>


    <nav class="nav">

      <a href="index.html#about">
        About
      </a>

      <a href="index.html#companies">
        Companies
      </a>

      <a href="index.html#partners">
        Partners
      </a>

      <a href="transport.html">
        Transport
      </a>

      <a href="fruit.html">
        Fruit
      </a>

      <a
        class="nav-cta"
        href="contact.html"
      >
        Contact
      </a>

    </nav>

  </header>


  <!-- CONTACT PAGE -->
  <main class="contact-page">

    <div class="shell contact-page-grid">


      <!-- LEFT SIDE -->
      <div>

        <p class="eyebrow">
          CONTACT JHUY
        </p>

        <h1>
          Start a conversation.
        </h1>

        <p
          style="
            font-size:18px;
            color:var(--muted);
          "
        >
          For transportation or fruit inquiries,
          send us the details and the appropriate
          JHUY team will follow up.
        </p>


        <div
          class="contact-list"
          style="margin-top:40px;"
        >

          <div class="contact-row">

            <span>Hours</span>

            <strong>
              Mon–Fri · 9:00 AM–5:00 PM
            </strong>

          </div>

        </div>

      </div>


      <!-- CONTACT FORM -->
      <form
        class="form"
        id="contact-form"
        action="https://script.google.com/macros/s/AKfycbx9zLuLkNprJxHgGMKDxgthCLqEvWrmbP6D_lSRUuRvkSqkcegAXns6W-1OruHDuM9I/exec"
        method="POST"
        target="form-submit-frame"
      >

        <div class="form-grid">


          <div class="field">

            <label for="name">
              Name
            </label>

            <input
              id="name"
              name="name"
              type="text"
              required
              placeholder="Your name"
            >

          </div>


          <div class="field">

            <label for="company">
              Company
            </label>

            <input
              id="company"
              name="company"
              type="text"
              placeholder="Company name"
            >

          </div>


          <div class="field">

            <label for="email">
              Email
            </label>

            <input
              id="email"
              name="email"
              type="email"
              required
              placeholder="you@company.com"
            >

          </div>


          <div class="field">

            <label for="inquiry_type">
              Inquiry type
            </label>

            <select
              id="inquiry_type"
              name="inquiry_type"
              required
            >

              <option value="">
                Select inquiry type
              </option>

              <option value="JHUY Transport">
                JHUY Transport
              </option>

              <option value="JHUY Fruit">
                JHUY Fruit
              </option>

            </select>

          </div>


          <div class="field full">

            <label for="message">
              Message
            </label>

            <textarea
              id="message"
              name="message"
              required
              placeholder="Tell us about your inquiry"
            ></textarea>

          </div>

        </div>


        <button
          class="btn"
          id="submit-btn"
          type="submit"
        >
          Send inquiry →
        </button>


        <p
          class="form-note"
          id="form-status"
        ></p>

      </form>


      <!-- Hidden frame prevents leaving the contact page -->
      <iframe
        name="form-submit-frame"
        id="form-submit-frame"
        style="display:none;"
      ></iframe>

    </div>

  </main>


  <!-- FOOTER -->
  <footer class="site-footer">

    <span>
      © <span data-year></span> JHUY Holdings.
    </span>

    <div class="footer-links">

      <a href="index.html">
        Holdings
      </a>

      <a href="transport.html">
        Transport
      </a>

      <a href="fruit.html">
        Fruit
      </a>

    </div>

  </footer>


  <script src="assets/site.js"></script>


  <!-- CONTACT FORM STATUS -->
  <script>

    const form =
      document.getElementById("contact-form");

    const status =
      document.getElementById("form-status");

    const submitButton =
      document.getElementById("submit-btn");


    form.addEventListener(
      "submit",
      function() {

        status.textContent =
          "Sending...";

        submitButton.disabled = true;


        setTimeout(function() {

          status.textContent =
            "Thank you. Your inquiry has been submitted.";

          form.reset();

          submitButton.disabled = false;

        }, 1500);

      }
    );

  </script>

</body>

</html>
